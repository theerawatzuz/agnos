apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/theerawatzuz/agnos.git
    targetRevision: production
    path: 03-argocd-apps/manifests/promtail
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
