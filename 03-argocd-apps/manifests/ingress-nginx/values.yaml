ingress-nginx:
  enabled: true

  controller:
    kind: DaemonSet
    hostPort:
      enabled: true
    service:
      externalTrafficPolicy: "Local" #To make real-ip works, need to restart pod
      enabled: false
    #  type: NodePort
    #  nodePorts:
    #    https: 32443
    #    http: 32080
    config:
      enable-real-ip: "true"
      proxy-body-size: "0"
      limit-rate: "0"
      limit-rate-after: "0"
    
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
    
    # Trigger Increase replicas for load testing (if not using DaemonSet)
    replicaCount: 3
