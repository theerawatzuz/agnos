apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-{{ .Values.environment }}-config
  labels:
    app: weather
    environment: {{ .Values.environment }}
data:
  APP_ENV: {{ .Values.environment }}
  LOG_LEVEL: {{ .Values.logLevel | default "info" | quote }}
  WEATHER_API_URL: {{ .Values.weatherApiUrl | quote }}
  WEATHER_LOCATION: {{ .Values.weatherLocation | quote }}
  WEATHER_Q: {{ .Values.weatherQ | quote }}
  PORT: {{ .Values.port | default "3001" | quote }}
