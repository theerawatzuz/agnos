apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-weather
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "0"
    nginx.ingress.kubernetes.io/limit-rps: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: "{{ .Values.domain }}"
      http:
        paths:
          - pathType: ImplementationSpecific
            path: "/"
            backend:
              service:
                name: weather-service
                port:
                  number: 3001
