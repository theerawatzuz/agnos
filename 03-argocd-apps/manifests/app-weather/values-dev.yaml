# Development environment overrides
environment: dev
domain: weather-dev.thebrainsurf.site
replicas: 1
imageTag: v27

# Dev-specific configuration
weatherLocation: "tokyo"
weatherQ: "35.6762,139.6503"
logLevel: "debug"

