# Production environment overrides
environment: production
domain: weather.thebrainsurf.site
replicas: 2
imageTag: v28

# Production-specific configuration
weatherLocation: "osaka"
weatherQ: "34.6937,135.5023"
logLevel: "info"

# Resource limits
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Autoscaling (production: enabled, easy to test)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 30
  targetMemoryUtilizationPercentage: 50
