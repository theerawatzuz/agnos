kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 7d
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
  
  grafana:
    enabled: true
    adminPassword: admin
    persistence:
      enabled: true
      storageClassName: longhorn
      size: 5Gi
    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki-production:3100
        access: proxy
        isDefault: false
    
  alertmanager:
    enabled: false
